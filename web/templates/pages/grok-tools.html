{{define "page-grok-tools"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="{{.AdminPath}}/css/main.css?v=20260918-phonefix1">
  <link rel="stylesheet" href="{{.AdminPath}}/css/grok-tools.css?v=20260926-build-chat1">
</head>
<body>
  {{template "sidebar.html" .}}
  <main class="main-content grok-tools-page">
    <section class="header-section grok-page-header">
      <span class="grok-eyebrow">GROK BUILD</span>
      <h1>Grok 对话</h1>
      <p class="grok-page-lede">使用 Build OAuth 账号测试 Responses API、模型与联网搜索。</p>
      <a class="btn btn-outline grok-account-link" href="{{.AdminPath}}/?tab=accounts">管理 Grok 账号</a>
    </section>
    <div class="grok-tools-workspace">
      <div class="toolbar toolbar-compact grok-tools-toolbar" aria-label="Grok 对话身份">
        <div class="grok-api-mode" aria-label="API 测试身份">
          <select id="grokRequestMode" class="form-input" title="管理员模式使用当前登录会话；Client Key 模式按真实密钥权限、限流和计费测试">
            <option value="admin">管理员模式</option>
            <option value="client">Client Key 模式</option>
          </select>
          <input id="grokClientKey" class="form-input hidden" type="password" autocomplete="off" placeholder="粘贴 sk-…（仅保存在当前标签页）">
          <button id="grokClientKeyApply" class="btn btn-outline hidden" type="button">应用密钥</button>
          <span id="grokClientKeyStatus" class="hint"></span>
        </div>
      </div>
      <section id="grokChatSection" class="content-card grok-section chat-main">
        <div class="chat-layout">
          <aside class="chat-sidebar" id="grokChatSidebar">
            <div class="sidebar-header">
              <span class="sidebar-title">会话</span>
              <div class="sidebar-actions">
                <button id="grokChatNewBtn" class="icon-btn sidebar-action-btn" type="button" title="新增会话">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
                <button id="grokChatCollapseBtn" class="icon-btn sidebar-action-btn" type="button" title="折叠会话">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 6 9 12 15 18"></polyline>
                  </svg>
                </button>
              </div>
            </div>
            <div id="grokSessionList" class="sidebar-list"></div>
          </aside>
          <div id="grokChatSidebarOverlay" class="sidebar-overlay"></div>
          <button id="grokChatExpandBtn" class="icon-btn sidebar-expand-btn" type="button" title="展开会话">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 6 15 12 9 18"></polyline>
            </svg>
          </button>
          <div class="chat-shell">
            <div class="chat-title">
              <div class="inline-flex-row chat-title-main">
                <button id="grokChatSidebarToggle" class="icon-btn sidebar-toggle" type="button" title="会话列表">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                  </svg>
                </button>
                <div>
                <h2 class="chat-title-text">对话</h2>
                <p class="chat-subtitle">选择模型，直接开始一段 Grok 对话</p>
                </div>
              </div>
              <div class="chat-title-actions">
                <button id="grokChatClearBtn" class="btn btn-outline chat-clear-btn" type="button" title="清空当前会话">清空当前会话</button>
                <span id="grokChatStatus" class="status-text">就绪</span>
              </div>
            </div>
            <div id="grokChatLog" class="chat-thread">
              <div id="grokChatEmpty" class="chat-empty">输入一条消息开始对话。</div>
            </div>
            <div class="composer-shell">
              <div class="composer-input">
                <textarea id="grokPromptInput" class="composer-textarea" placeholder="询问任何内容"></textarea>
                <div class="composer-actions">
                  <div class="model-chip" id="grokModelChip">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                      <line x1="8" y1="21" x2="16" y2="21"></line>
                      <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span id="grokModelLabel" class="model-label">加载模型…</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                    <div id="grokModelDropdown" class="model-dropdown"></div>
                  </div>
                  <div class="popover">
                    <button id="grokSettingsToggle" class="icon-btn" type="button" title="设置" aria-haspopup="dialog" aria-expanded="false">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01A1.65 1.65 0 0 0 9 4.6V4a2 2 0 0 1 4 0v.09c0 .69.4 1.31 1.02 1.58.52.23 1.12.2 1.6-.07l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06c-.45.45-.58 1.12-.33 1.72.25.6.82 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.69 0-1.31.4-1.51 1Z"></path>
                      </svg>
                    </button>
                    <div id="grokSettingsPanel" class="settings-panel chat-settings-panel" role="dialog" aria-label="Chat 设置" aria-hidden="true">
                      <div class="settings-panel-head chat-settings-head">
                        <h3 class="settings-panel-title">Chat 设置</h3>
                        <button id="grokSettingsCloseBtn" class="icon-btn panel-close-btn" type="button" title="关闭">
                          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18"></path>
                            <path d="m6 6 12 12"></path>
                          </svg>
                        </button>
                      </div>
                      <div class="settings-grid">
                        <div class="chat-settings-ranges">
                          <div class="settings-block">
                            <label class="field-label" for="grokReasoningEffort">推理强度</label>
                            <select id="grokReasoningEffort" class="form-input">
                              <option value="">自动</option><option value="none">关闭</option><option value="low">低</option>
                              <option value="medium">中</option><option value="high">高</option><option value="xhigh">极高</option>
                            </select>
                          </div>
                          <div class="settings-block">
                            <span class="field-label">联网工具</span>
                            <label><input id="grokWebSearch" type="checkbox"> Web 搜索</label>
                            <label><input id="grokXSearch" type="checkbox"> X 搜索</label>
                          </div>
                        </div>
                        <div class="settings-block settings-block-full">
                          <label class="field-label" for="grokSystemInput">系统提示词</label>
                          <textarea id="grokSystemInput" class="form-input chat-input chat-system-input" rows="6" placeholder="设置系统提示词"></textarea>
                        </div>
                      </div>
                    </div>
                  </div>
                  <button id="grokSendBtn" class="send-btn" type="button" title="发送">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M22 2L11 13"></path>
                      <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>
  <div class="toast-container" id="toastContainer"></div>
  <script src="{{.AdminPath}}/js/common.js?v=20260925-abnormal1"></script>
  <script src="{{.AdminPath}}/js/provider-registry.js?v=20260924-backend-registry1"></script>
  <script src="{{.AdminPath}}/js/grok-tools.js?v=20260926-build-chat1"></script>
</body>
</html>
{{end}}
